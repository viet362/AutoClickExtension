<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Web Thử Nghiệm AutoFlow (Demo Form)</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d30;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --success: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title { font-size: 20px; font-weight: 700; color: #fff; }
    .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .badge {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select, textarea {
      background: #0d1322;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #fff;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .btn-submit {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      transform: translateY(-1px);
    }
    .results-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--text-muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 class="title">Hệ Thống Quản Lý Đơn Hàng (Trang Demo Thử Nghiệm)</h1>
        <p class="subtitle">Dùng để kiểm tra khả năng tự động click, gõ phím và nạp file Excel của AutoFlow</p>
      </div>
      <div class="badge">Môi trường Test</div>
    </div>

    <form class="form-card" id="demoForm" onsubmit="event.preventDefault(); handleSave();">
      <div class="form-group">
        <label for="orderCode">Mã đơn hàng (Nhập từ Cột Ma_Don):</label>
        <input type="text" id="orderCode" name="orderCode" placeholder="Ví dụ: ORD-001" required>
      </div>

      <div class="form-group">
        <label for="customerName">Tên khách hàng (Nhập từ Cột Ten_Khach_Hang):</label>
        <input type="text" id="customerName" name="customerName" placeholder="Ví dụ: Nguyen Van An" required>
      </div>

      <div class="form-group">
        <label for="amount">Số tiền (VNĐ) (Nhập từ Cột So_Tien):</label>
        <input type="number" id="amount" name="amount" placeholder="Ví dụ: 1500000" required>
      </div>

      <div class="form-group">
        <label for="status">Trạng thái đơn hàng:</label>
        <select id="status" name="status">
          <option value="Da thanh toan">Đã thanh toán</option>
          <option value="Cho xac nhan">Chờ xác nhận</option>
          <option value="Dang giao hang">Đang giao hàng</option>
          <option value="Hoan tat">Hoàn tất</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Ghi chú (Nhập từ Cột Ghi_Chu):</label>
        <textarea id="notes" name="notes" rows="2" placeholder="Ghi chú đơn hàng..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmitForm">💾 Lưu đơn hàng vào hệ thống</button>
    </form>

    <div class="results-card">
      <h3 style="font-size: 15px; margin-bottom: 12px; color: #fff;">Danh sách đơn hàng vừa được xử lý tự động:</h3>
      <table id="historyTable">
        <thead>
          <tr>
            <th>Thời gian</th>
            <th>Mã đơn</th>
            <th>Khách hàng</th>
            <th>Số tiền</th>
            <th>Trạng thái</th>
            <th>Ghi chú</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr>
            <td colspan="6" style="text-align: center; color: #64748b; padding: 18px;">Chưa có đơn hàng nào được nhập.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let count = 0;
    function handleSave() {
      const code = document.getElementById('orderCode').value;
      const name = document.getElementById('customerName').value;
      const amount = document.getElementById('amount').value;
      const status = document.getElementById('status').value;
      const notes = document.getElementById('notes').value;

      const body = document.getElementById('historyBody');
      if (count === 0) body.innerHTML = '';
      count++;

      const tr = document.createElement('tr');
      const time = new Date().toLocaleTimeString('vi-VN');
      tr.innerHTML = `
        <td><span style="color: #6366f1; font-weight: 600;">${time}</span></td>
        <td><strong>${code}</strong></td>
        <td>${name}</td>
        <td>${Number(amount).toLocaleString('vi-VN')} đ</td>
        <td><span style="color: #10b981; font-weight: 600;">${status}</span></td>
        <td>${notes || '-'}</td>
      `;
      body.prepend(tr);

      // Reset form sau khi lưu
      document.getElementById('demoForm').reset();
      console.log(`[Demo] Đã lưu thành công đơn: ${code}`);
    }
  </script>
</body>
</html>
